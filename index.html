    function toggleSideDrawer() {
      const drawer = document.getElementById('sideDrawer');
      const overlay = document.getElementById('drawerOverlay');
      drawer.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function closeSideDrawer() {
      document.getElementById('sideDrawer').classList.remove('open');
      document.getElementById('drawerOverlay').classList.remove('active');
    }

    function navigateFromDrawer(tabId) {
      closeSideDrawer();
      switchTab(tabId);
    }

    function scrollToAdminSection(sectionId) {
      switchTab('adminTab');
      setTimeout(() => {
        const el = document.getElementById(sectionId);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }, 100);
    }

    function navigateAndScroll(sectionId) {
      closeSideDrawer();
      scrollToAdminSection(sectionId);
    }

    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      if (touchEndX - touchStartX > 80 && touchStartX < 50) {
        toggleSideDrawer();
      } else if (touchStartX - touchEndX > 80) {
        closeSideDrawer();
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      const targetTab = document.getElementById(tabId);
      if (targetTab) targetTab.classList.remove('hidden');

      if (window.event && window.event.currentTarget && window.event.currentTarget.classList.contains('tab-btn')) {
        window.event.currentTarget.classList.add('active');
      }
    }

    function toggleAuthMode(e) {
      if (e) e.preventDefault();
      isRegisterMode = !isRegisterMode;
      if (isRegisterMode) {
        authTitle.innerText = "Créer un compte";
        registerFields.classList.remove('hidden');
        authSubmitBtn.innerText = "S'inscrire";
        toggleAuthText.innerText = "Déjà inscrit ?";
        toggleAuthLink.innerText = "Se connecter";
      } else {
        authTitle.innerText = "Espace Connexion";
        registerFields.classList.add('hidden');
        authSubmitBtn.innerText = "Se connecter";
        toggleAuthText.innerText = "Nouveau sur le portail ?";
        toggleAuthLink.innerText = "Créer un compte";
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authUsername').value.trim();
      const password = document.getElementById('authPassword').value.trim();

      if (!email || !password) {
        alert("Veuillez remplir l'adresse e-mail et le mot de passe.");
        return;
      }

      if (isRegisterMode) {
        const name = document.getElementById('authName').value.trim();
        const role = document.getElementById('authRole').value;
        const code = document.getElementById('authCode').value.trim();

        if (role === 'admin') {
          if (code !== ADMIN_SECRET_CODE) {
            alert("Code d'activation Administrateur incorrect !");
            return;
          }
        } else {
          if (code !== STUDENT_SECRET_CODE) {
            alert("Code d'activation étudiant incorrect ! Demandez-le au BDE.");
            return;
          }
        }

        if (!name) {
          alert("Veuillez saisir votre nom et prénom.");
          return;
        }

        const level = (role === 'admin') ? "ADMIN" : document.getElementById('authLevel').value;
        const major = (role === 'admin') ? "Administration BDE" : document.getElementById('authMajor').value;
        const adminPost = (role === 'admin') ? document.getElementById('authAdminPost').value : null;

        if (role === 'student' && !major) {
          alert("Veuillez sélectionner votre filière.");
          return;
        }

        firebase.auth().createUserWithEmailAndPassword(email, password)
          .then((userCredential) => {
            const authUser = userCredential.user;

            authUser.sendEmailVerification().then(() => {
              const userId = authUser.uid;
              const newUser = {
                id: userId,
                name: name,
                username: email,
                email: email,
                level: level,
                major: major,
                role: role,
                adminPost: adminPost
              };

              db.ref('users/' + userId).set(newUser, (error) => {
                if (error) {
                  alert("Erreur de sauvegarde : " + error.message);
                } else {
                  firebase.auth().signOut();
                  alert("Compte créé ! 📧 Un e-mail de confirmation a été envoyé à " + email + ". Cliquez sur le lien pour l'activer.");
                  toggleAuthMode(e);
                }
              });
            });
          })
          .catch((error) => {
            alert("Erreur lors de l'inscription : " + error.message);
          });

      } else {
        firebase.auth().signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            const authUser = userCredential.user;

            if (!authUser.emailVerified) {
              alert("⚠️ Adresse e-mail non vérifiée ! Veuillez consulter votre boîte mail.");
              firebase.auth().signOut();
              return;
            }

            db.ref('users/' + authUser.uid).once('value', (snapshot) => {
              const profileData = snapshot.val();
              currentProfile = profileData || {
                id: authUser.uid,
                name: authUser.email.split('@')[0],
                username: authUser.email,
                role: 'student',
                level: 'L1',
                major: 'Non spécifié'
              };

              localStorage.setItem('ehes_user', JSON.stringify(currentProfile));
              registerLogin();
              checkUserSession();
              alert("Connexion réussie ! Bienvenue " + currentProfile.name);
            });
          })
          .catch(() => {
            alert("Erreur : Adresse e-mail ou mot de passe incorrect.");
          });
      }
    }

    function formatDriveLink(url) {
      if (!url) return '#';
      url = url.trim();
      if (url.includes('drive.google.com') && url.includes('/d/')) {
        const parts = url.split('/d/')[1].split('/');
        const fileId = parts[0];
        return `https://drive.google.com/uc?export=download&id=${fileId}`;
      }
      return url;
    }

    function renderCourses() {
      if (!currentProfile) {
        coursesContainer.innerHTML = '<p style="color:var(--light-text);">Connectez-vous pour voir vos cours.</p>';
        return;
      }
      
      const allCourses = Object.values(coursesList);
      const selectedMajor = document.getElementById('filterMajor').value;
      const query = document.getElementById('searchCourseInput').value.toLowerCase().trim();

      let userCourses = allCourses;
      if (currentProfile.role !== 'admin') {
        userCourses = allCourses.filter(c => c.level === currentProfile.level);
      }

      if (selectedMajor !== 'ALL') {
        userCourses = userCourses.filter(c => c.major === selectedMajor);
      }

      if (query) {
        userCourses = userCourses.filter(c => c.title.toLowerCase().includes(query));
      }

      if (!userCourses.length) {
        coursesContainer.innerHTML = '<p style="color:var(--light-text);">Aucun cours correspondant trouvé.</p>';
        return;
      }

      const grouped = {};
      userCourses.forEach(c => {
        const majorKey = c.major || "Général";
        if (!grouped[majorKey]) grouped[majorKey] = [];
        grouped[majorKey].push(c);
      });

      let html = '';
      for (let major in grouped) {
        html += `<div class="level-group">`;
        html += `<div class="level-title">📂 ${major}</div>`;
        grouped[major].forEach(c => {
          const downloadUrl = formatDriveLink(c.url);
          html += `
            <div style="background:#fdfbf7; padding:12px; margin-bottom:10px; border-left:4px solid var(--secondary); border-radius:8px;">
              <strong>${c.title}</strong><br>
              <a href="${downloadUrl}" class="drive-link" target="_blank" download>💾 Télécharger le document</a>
            </div>
          `;
        });
        html += `</div>`;
      }

      coursesContainer.innerHTML = html;
    }

    function renderBiblio() {
      const container = document.getElementById('biblioList');
      if (!container) return;

      const allBooks = Object.values(booksList);
      const selectedMajor = document.getElementById('biblioFilterMajor').value;
      const query = document.getElementById('searchBiblioInput').value.toLowerCase().trim();

      let filteredBooks = allBooks;
      if (selectedMajor !== 'ALL') {
        filteredBooks = allBooks.filter(b => b.major === selectedMajor);
      }

      if (query) {
        filteredBooks = filteredBooks.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query));
      }

      if (!filteredBooks.length) {
        container.innerHTML = '<p style="color:var(--light-text);">Aucun ouvrage correspondant trouvé.</p>';
        return;
      }

      let html = '';
      filteredBooks.forEach(b => {
        const downloadUrl = formatDriveLink(b.url);
        html += `
          <div style="background:#fdfbf7; padding:12px; margin-bottom:10px; border-left:4px solid var(--primary); border-radius:8px;">
            <strong>📖 ${b.title}</strong> <small style="color:var(--light-text);">par ${b.author}</small>
            <div><span class="major-badge">${b.major}</span></div>
            <a href="${downloadUrl}" class="drive-link" target="_blank" download>💾 Accéder au livre</a>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function renderSchedules() {
      const schedContainer = document.getElementById('scheduleList');
      if (!schedContainer) return;

      const allSchedules = Object.values(schedulesList);

      let mySchedules = allSchedules;
      if (currentProfile && currentProfile.role !== 'admin') {
        mySchedules = allSchedules.filter(s => (s.major === currentProfile.major || s.major === 'TOUS') && (s.level === currentProfile.level || s.level === 'TOUS'));
      }

      schedContainer.innerHTML = mySchedules.length ? '' : '<p style="color:var(--light-text);">Aucun emploi du temps disponible.</p>';
      mySchedules.forEach(s => {
        const downloadUrl = formatDriveLink(s.url);
        let linkHtml = s.url ? `<a href="${downloadUrl}" class="drive-link" target="_blank">📄 Consulter le document</a>` : '';
        let mediaHtml = s.mediaData ? `<img src="${s.mediaData}" class="feed-media">` : '';

        schedContainer.innerHTML += `
          <div style="background:#fdfbf7; padding:12px; margin-bottom:10px; border-left:4px solid var(--secondary); border-radius:8px;">
            <strong>🗓️ ${s.title}</strong> (${s.major} - ${s.level})<br>
            ${mediaHtml}
            ${linkHtml}
          </div>
        `;
      });
    }

    function renderAnnouncements() {
      const ONE_WEEK_MS = 7 * 24 * 60 * 60 * 1000;
      const allPosts = Object.values(postsList).filter(p => (Date.now() - p.timestamp) < ONE_WEEK_MS);
      allPosts.sort((a,b) => b.timestamp - a.timestamp);

      announcementsContainer.innerHTML = allPosts.length ? '' : '<p style="color:var(--light-text);">Aucune nouvelle annonce pour le moment.</p>';
      allPosts.forEach(p => {
        const dateStr = new Date(p.timestamp).toLocaleDateString();
        let mediaHtml = '';

        if (p.mediaData) {
          if (p.mediaType && p.mediaType.startsWith('image/')) {
            mediaHtml = `<img src="${p.mediaData}" class="feed-media">`;
          } else if (p.mediaType && p.mediaType.startsWith('video/')) {
            mediaHtml = `<video src="${p.mediaData}" controls class="feed-media"></video>`;
          }
        }

    function isLeader(user) {
      if (!user) return false;
      if (user.role === 'admin') {

        const post = user.adminPost.toLowerCase().trim();
        return post.includes('president') || post.includes('président') || post.includes('vice');
      }
      return false;

    function updateNotifBadge() {
      const ONE_WEEK_MS = 7 * 24 * 60 * 60 * 1000;
      const recentPosts = Object.values(postsList).filter(p => (Date.now() - p.timestamp) < ONE_WEEK_MS);
      
      const userNotifs = Object.values(notificationsList).filter(n => {
        if ((Date.now() - n.timestamp) >= ONE_WEEK_MS) return false;
        if (n.target === 'all') return true;
        if (currentProfile && n.target === currentProfile.id) return true;
        if (currentProfile && n.target === 'leaders' && isLeader(currentProfile)) return true;
        return false;
      });

      const totalNotifs = recentPosts.length + userNotifs.length;
      
      const badge = document.getElementById('notifBadge');
      if (unreadNotifCount === 0 && totalNotifs > 0) {
        unreadNotifCount = totalNotifs;
      }
      if (unreadNotifCount > 0) {
        badge.innerText = unreadNotifCount;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }

    function renderDropdownNotifications() {
      const container = document.getElementById('notifDropdownList');
      if (!container) return;

      const ONE_WEEK_MS = 7 * 24 * 60 * 60 * 1000;
      const recentPosts = Object.values(postsList).filter(p => (Date.now() - p.timestamp) < ONE_WEEK_MS).map(p => ({ title: p.title, content: p.content, timestamp: p.timestamp, type: 'post' }));
      
      const userNotifs = Object.values(notificationsList).filter(n => {
        if ((Date.now() - n.timestamp) >= ONE_WEEK_MS) return false;
        if (n.target === 'all') return true;
        if (currentProfile && n.target === currentProfile.id) return true;
        if (currentProfile && n.target === 'leaders' && isLeader(currentProfile)) return true;
        return false;
      }).map(n => ({ title: n.title, content: n.body, timestamp: n.timestamp, type: 'notif' }));
      
      const allItems = [...recentPosts, ...userNotifs];
      allItems.sort((a,b) => b.timestamp - a.timestamp);

      if (!allItems.length) {
        container.innerHTML = '<p id="noNotifDropdownText" style="text-align: center; color: var(--light-text); font-size: 0.85rem; padding: 15px 0; margin: 0;">Aucune notification pour le moment</p>';
      } else {
        let html = '';
        allItems.forEach(p => {
          const prefix = p.type === 'notif' ? '📲' : '📢';
          const timeStr = new Date(p.timestamp).toLocaleDateString();
          html += `
            <div style="padding: 8px 0; border-bottom: 1px solid #eee; margin-bottom: 5px;">
              <strong style="font-size: 0.85rem; color: var(--primary);">${prefix} ${p.title}</strong>

              <div style="font-size: 0.68rem; color: var(--light-text); text-align: right;">${timeStr}</div>

          `;
        });
        container.innerHTML = html;
      }
    }

    /* GESTION DES PROJETS BDE AVEC NOTIFICATION & BOUTONS PR / VICE-PR */
    function submitProject() {
      if (!currentProfile || currentProfile.role !== 'admin') return;
      const title = document.getElementById('projTitle').value.trim();
      const desc = document.getElementById('projDesc').value.trim();
      const month = document.getElementById('projTargetMonth').value;

      if (!title || !desc || !month) {
        alert("Veuillez remplir tous les champs du projet.");
        return;
      }

      const allProjects = Object.values(projectsList);
      const myProjectsThisMonth = allProjects.filter(p => p.authorId === currentProfile.id && p.month === month);
      
      if (myProjectsThisMonth.length >= 3) {
        alert("⚠️ Votre ministère a déjà atteint la limite de 3 projets pour ce mois !");
        return;
      }

      const authorPostName = currentProfile.adminPost || 'Ministère';

      db.ref('projects').push({
        title,
        desc,
        month,
        authorId: currentProfile.id,
        authorName: currentProfile.name,
        authorPost: authorPostName,
        status: 'En attente',
        timestamp: Date.now()
      }, (error) => {
        if (!error) {
          db.ref('notifications').push({
            title: "📋 Nouveau projet à valider",
            body: `Le ministère de [${authorPostName}] (${currentProfile.name}) a soumis le projet : "${title}".`,
            target: 'leaders',
            timestamp: Date.now()
          });

          alert("Projet soumis avec succès ! Le Président et le Vice-Président ont été notifiés.");
          document.getElementById('projTitle').value = '';
          document.getElementById('projDesc').value = '';
        } else {
          alert("Erreur lors de la soumission : " + error.message);
        }
      });
    }

    function promoteStudentLevel(userKey) {
      const student = usersList[userKey];
      if (!student) return;

      let nextLevel = student.level;
      const major = student.major;

      if (major === "Gestion des Entreprises" || major === "Transport & Logistique") {
        if (student.level === "L1") nextLevel = "L2";
        else if (student.level === "L2") nextLevel = "L3";
        else if (student.level === "L3") nextLevel = "Alumni";
      } else if (major === "Pétrole et Gaz") {
        if (student.level === "L1") nextLevel = "L2";
        else if (student.level === "L2") nextLevel = "L3";
        else if (student.level === "L3") nextLevel = "M1";
        else if (student.level === "M1") nextLevel = "Alumni";
      } else {
        if (student.level === "L1") nextLevel = "L2";
        else if (student.level === "L2") nextLevel = "L3";
        else if (student.level === "L3") nextLevel = "M1";
        else if (student.level === "M1") nextLevel = "M2";
        else if (student.level === "M2") nextLevel = "Alumni";
      }

      if (nextLevel === student.level) {
        alert(`${student.name} est déjà au niveau maximum (${student.level}).`);
        return;
      }

      if (confirm(`Faire passer ${student.name} (${major}) de ${student.level} à ${nextLevel} ?`)) {
        db.ref('users/' + userKey).update({ level: nextLevel }, (error) => {
          if (!error) {
            alert(`Niveau mis à jour avec succès : ${nextLevel}`);
            if (currentProfile && currentProfile.id === userKey) {
              currentProfile.level = nextLevel;
              localStorage.setItem('ehes_user', JSON.stringify(currentProfile));
              checkUserSession();
            }
          }
        });
      }
    }

      });

      alert("Notification envoyée à tous les membres !");
      document.getElementById('adminNotifTitle').value = '';
      document.getElementById('adminNotifBody').value = '';
    });

    document.getElementById('publishPostBtn').addEventListener('click', () => {
      const title = document.getElementById('postTitle').value.trim();
      const content = document.getElementById('postContent').value.trim();
      const fileInput = document.getElementById('postFileInput');
      const file = fileInput.files[0];

      if (!title || !content) {
        alert("Veuillez saisir un titre et un contenu.");
        return;
      }

      if (file) {
        if (file.type.startsWith('image/')) {
          compressAndSaveImage(file, (compressedData) => {
            savePost(title, content, compressedData, 'image/jpeg');
          });
        } else {
          const reader = new FileReader();
          reader.onload = function (e) {
            savePost(title, content, e.target.result, file.type);
          };
          reader.readAsDataURL(file);
        }
      } else {
        savePost(title, content, null, null);
      }
    });

    function compressAndSaveImage(file, callback) {
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 800;

          if (width > height && width > maxDim) {
            height *= maxDim / width;
            width = maxDim;
          } else if (height > maxDim) {
            width *= maxDim / height;
            height = maxDim;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const compressedData = canvas.toDataURL('image/jpeg', 0.7);
          callback(compressedData);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function savePost(title, content, mediaData, mediaType) {
      db.ref('posts').push({
        title,
        content,
        mediaData,
        mediaType,
        timestamp: Date.now()
      });
      alert("Annonce optimisée et publiée en ligne !");
      document.getElementById('postTitle').value = '';
      document.getElementById('postContent').value = '';
      document.getElementById('postFileInput').value = '';
    }

    document.getElementById('publishCourseBtn').addEventListener('click', () => {
      const major = document.getElementById('courseMajor').value;
      const level = document.getElementById('courseLevel').value;
      const title = document.getElementById('courseTitle').value.trim();
      const url = document.getElementById('courseDriveUrl').value.trim();

      if (!title || !url) {
        alert("Veuillez remplir tous les champs.");
        return;
      }

      db.ref('courses').push({ major, level, title, url });
      alert(`Cours ajouté pour ${major} - ${level} !`);
      document.getElementById('courseTitle').value = '';
      document.getElementById('courseDriveUrl').value = '';
    });

    document.getElementById('publishBookBtn').addEventListener('click', () => {
      const major = document.getElementById('bookMajor').value;
      const title = document.getElementById('bookTitle').value.trim();
      const author = document.getElementById('bookAuthor').value.trim();
      const url = document.getElementById('bookDriveUrl').value.trim();

      if (!title || !url || !author) {
        alert("Veuillez remplir tous les champs.");
        return;
      }

      db.ref('books').push({ major, title, author, url });
      alert(`Livre "${title}" ajouté à la bibliothèque !`);
      document.getElementById('bookTitle').value = '';
      document.getElementById('bookAuthor').value = '';
      document.getElementById('bookDriveUrl').value = '';
    });

    document.getElementById('publishSchedBtn').addEventListener('click', () => {
      const major = document.getElementById('schedMajor').value;
      const level = document.getElementById('schedLevel').value;
      const title = document.getElementById('schedTitle').value.trim();
      const url = document.getElementById('schedDriveUrl').value.trim();
      const fileInput = document.getElementById('schedFileInput');
      const file = fileInput ? fileInput.files[0] : null;

      if (!title) {
        alert("Veuillez préciser au moins le titre du planning.");
        return;
      }

      if (file) {
        compressAndSaveImage(file, (compressedData) => {
          db.ref('schedules').push({ major, level, title, url, mediaData: compressedData });
          alert(`Planning / Événement publié avec photo !`);
          resetSchedForm();
        });
      } else {
        db.ref('schedules').push({ major, level, title, url });
        alert(`Planning / Événement publié !`);
        resetSchedForm();
      }
    });

    function resetSchedForm() {
      document.getElementById('schedTitle').value = '';
      document.getElementById('schedDriveUrl').value = '';
      if (document.getElementById('schedFileInput')) {
        document.getElementById('schedFileInput').value = '';
      }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker PWA prêt !', reg.scope))
          .catch((err) => console.error('Erreur PWA :', err));
      });
    }

    checkUserSession();
  </script>
</body>
</html>
